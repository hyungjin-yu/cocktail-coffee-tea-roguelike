<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>레이피어 찌르기 VFX 시험</title><style>
body{margin:0;background:#151922;color:#e5edf5;font:16px system-ui;padding:32px}main{max-width:860px;margin:auto}button,select{font:inherit;padding:8px;margin:8px 8px 8px 0}#stage{height:260px;background:#252c38;border:1px solid #465265;position:relative;overflow:hidden}#anchor{position:absolute;left:50%;top:45%;width:280px;height:94px;transform:translateX(-110px)}#fx{width:280px;opacity:0;transform-origin:6% 48%;image-rendering:pixelated}p{line-height:1.6}small{color:#b1c0d0}</style><main><h1>레이피어 찌르기 · VFX 시험</h1><p>한 장의 투명 텍스처를 빠르게 늘리고 감쇠하는 동작입니다.</p><div id="stage"><div id="anchor"><img id="fx" src="melee_thrust_right_v01.png" alt="오른쪽으로 뻗는 찌르기 궤적"></div></div><button id="play">찌르기</button><button id="loop">반복 정지</button><select id="speed" aria-label="재생 속도"><option value="1">실제 속도 · 0.12초</option><option value="4">4배 느리게</option></select><select id="direction" aria-label="방향"><option value="1">오른쪽</option><option value="-1">왼쪽</option></select><p><small>브라우저 동작 시안입니다. Unity 적용 및 실제 게임 화면 검증 전이며, 기존 공격 판정을 표현하는 디버그 화면이 아닙니다.</small></p></main><script>
const fx=document.getElementById('fx'),speed=document.getElementById('speed'),direction=document.getElementById('direction');let active=true,animation;
function play(){if(animation)animation.cancel();document.getElementById('anchor').style.transform='translateX(-110px) scaleX('+direction.value+')';animation=fx.animate([{opacity:0,transform:'scale(.2,.55)',offset:0},{opacity:1,transform:'scale(.8,1)',offset:.18},{opacity:.9,transform:'scale(1,1)',offset:.42},{opacity:0,transform:'scale(1.12,.18)',offset:1}],{duration:120*Number(speed.value),fill:'forwards',easing:'linear'});}
document.getElementById('play').onclick=play;document.getElementById('loop').onclick=function(){active=!active;this.textContent=active?'반복 정지':'반복 재생';if(active)play();};setInterval(()=>{if(active)play()},1000);fx.onload=play;if(fx.complete)play();
</script></html>
